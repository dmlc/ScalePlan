[project]
name = "dlcalc"
readme = "README.md"
version = "1.0.0"
description = "Deep Learning Performance Calculator with Parallelism Search"
authors = [
    {name = "Justin Chiu", email = "jfc4050@gmail.com"},
    {name = "dlcalc Contributors"}
]
requires-python = ">=3.10"
keywords = ["deep-learning", "performance", "parallelism", "moe", "transformer", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    # Configuration and serialization
    "PyYAML>=6.0.1",
    # Progress bars and UI
    "tqdm>=4.66.4",
    # Plotting and visualization
    "matplotlib>=3.5.0",
    # AWS and cloud dependencies
    "boto3>=1.34.133",
    "kubernetes>=30.1.0",
    # Visualization
    "pyvis>=0.3.2",
    # MLflow and tracking (optional dependencies moved to extras)
]
[project.optional-dependencies]
mlflow = [
    "mlflow>=2.22.1",
]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.4.3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pre-commit>=3.7.0"
]
all = [
    "mlflow>=2.22.1",
    "mypy>=1.10.0",
    "ruff>=0.4.3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pre-commit>=3.7.0"
]

[project.scripts]
3dtrn = "dlcalc.training_3d:main"
topoviz = "dlcalc.topology_visualizer:main"
topoeval = "dlcalc.topology_evaluate:main"
topoassign = "dlcalc.topology_scheduler:main"
sps2tpd = "dlcalc.samples_per_sec_to_tokens_per_day:main"
sps2mfu = "dlcalc.samples_per_sec_to_mfu:main"
ckpt-summarize = "dlcalc.summarize_checkpoint:main"
# Parallelism search tools
parallelism-search = "parallelism_search.search_example:main"

[tool.pytest.ini_options]
testpaths = ["dlcalc/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = [
    "kubernetes",
    "kubernetes.*",
    "botocore.*",
    "pyvis.*",
    "torch",
    "torch.*"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # isort
    "I",
    # pyupgrade
    "UP",
    # flake8-future-annotations
    "FA",
]

[tool.ruff.lint.pyupgrade]
# Preserve types that are available in Python 3.10+
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["dlcalc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["dlcalc"]
