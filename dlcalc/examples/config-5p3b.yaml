model:
  n_layers: 32  # num_layers
  hidden_sz: 4096  # hidden_size
  inter_sz: 10240  # ffn_hidden_size
  n_q_heads: 32  # num_attention_heads
  n_kv_heads: 8  # num_query_groups
  head_dim: 128  # kv_channels / num_attention_heads
  vocab_sz: 257664  # padded vocab_size (257540 padded to div 128)
  precision: "bf16"
  sdpa_precision: "bf16"
  glu: true
  rotary_embeds: true
  dropout: false
  tie_embeddings: false

  moe:
    n_experts: 128
    experts_per_token: 3  # moe_router_topk
    capacity_factor: 1.0
    expert_inter_sz: 2560  # moe_ffn_hidden_size
    moe_frequency: 1
    expert_tp_degree: 1  # expert_tensor_parallel_size (from job yaml)

parallelism:
  tp: 1
  ep: 8
  pp: 2
  cp: 1
  dp: 256  # dense DP: 512 GPUs / (tp*pp*cp) = 512/2. Expert DP = dp/ep = 32.
  vpp: 1
  sp: true
  zero_level: 0  # use_distributed_optimizer=false -> AllReduce grads
  n_param_buckets: 8

performance:
  activation_checkpointing_type: full  # recompute_granularity: full

optimizer:
  optimizer_type: muon  # scion (muon-family)

data:
  gbs: 4096  # global_batch_size
  seqlen: 8192  # seq_length
  microbatch_sz: 1  # micro_batch_size

hardware:
  node_type: p6-b200.48xlarge
