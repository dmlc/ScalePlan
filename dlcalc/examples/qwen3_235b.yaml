# Qwen3-235B-A22B Configuration based on Technical Report
model:
  n_layers: 94
  hidden_sz: 8192
  inter_sz: 8192
  n_q_heads: 64
  n_kv_heads: 4
  head_dim: 128
  vocab_sz: 151669
  precision: "bf16"  # Options: fp32, fp16, bf16, int8, fp8
  glu: true
  rotary_embeds: true
  dropout: false
  tie_embeddings: false
  moe:
    n_experts: 128
    experts_per_token: 8
    capacity_factor: 1.0
    expert_inter_sz: 22528
    moe_frequency: 1.0
    expert_tp_degree: 1

parallelism:
  tp: 8
  ep: 16
  pp: 2
  cp: 1
  dp: 32
  vpp: 1
  sp: true
  zero_level: 1

  n_param_buckets: 8

performance:
  activation_checkpointing_type: selective


optimizer:
  optimizer_type: muon
data:
  gbs: 4096
  seqlen: 128000  # 128K context length as mentioned in Table 2
  microbatch_sz: 1

hardware:
  node_type: p4d.24xlarge
