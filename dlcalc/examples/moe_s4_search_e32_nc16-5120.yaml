model:
  n_layers: 16
  hidden_sz: 2048
  inter_sz: 5120
  n_q_heads: 16
  n_kv_heads: 8
  head_dim: 128
  vocab_sz: 257536
  precision: "fp8"  # Options: fp32, fp16, bf16, int8, fp8
  sdpa_precision: "bf16"  # Options: fp16, bf16, fp8
  glu: true
  rotary_embeds: true
  dropout: false
  tie_embeddings: true
  moe:
    n_experts: 128
    experts_per_token: 1
    capacity_factor: 1.25
    expert_inter_sz: 2560
    moe_frequency: 1
    expert_tp_degree: 1

parallelism:
  tp: 8
  ep: 2
  pp: 4
  cp: 1
  dp: 4
  vpp: 1
  sp: true
  zero_level: 1
  n_param_buckets: 8

performance:
  activation_checkpointing_type: selective


optimizer:
  optimizer_type: muon
data:
  gbs: 256
  seqlen: 8192
  microbatch_sz: 1

hardware:
  node_type: p6-b200.48xlarge
