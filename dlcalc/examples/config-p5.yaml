model:
  n_layers: 64
  hidden_sz: 8192
  inter_sz: 20480
  n_q_heads: 64
  n_kv_heads: 8
  head_dim: 128
  vocab_sz: 257536
  precision: "bf16"  # Options: fp32, fp16, bf16, int8, fp8
  sdpa_precision: "bf16"
  glu: true
  rotary_embeds: true
  dropout: false
  tie_embeddings: true
  moe:
    n_experts: 96
    experts_per_token: 3
    capacity_factor: 1
    expert_inter_sz: 5120
    moe_frequency: 1
    expert_tp_degree: 1

parallelism:
  tp: 1
  ep: 32
  pp: 8
  cp: 4
  dp: 64
  vpp: 1
  sp: true
  zero_level: 1
  n_param_buckets: 8

performance:
  activation_checkpointing_type: selective


optimizer:
  optimizer_type: muon
data:
  gbs: 896
  seqlen: 8192
  microbatch_sz: 1

hardware:
  node_type: p5.48xlarge
